name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Ruby
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6 # Not needed with a .ruby-version file
      - name: Testing
        run: |
          make
          make run
